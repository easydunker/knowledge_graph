name: Validate plugin package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile skills/research-kb/scripts/research_kb.py scripts/evaluate_public_pdfs.py
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool .codex-plugin/plugin.json > /dev/null
